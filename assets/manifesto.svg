<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#001008"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes typeIn1 { 0%{opacity:0} 10%,100%{opacity:1} }
    @keyframes typeIn2 { 0%,15%{opacity:0} 25%,100%{opacity:1} }
    @keyframes typeIn3 { 0%,30%{opacity:0} 40%,100%{opacity:1} }
    @keyframes typeIn4 { 0%,45%{opacity:0} 55%,100%{opacity:1} }
    @keyframes typeIn5 { 0%,60%{opacity:0} 70%,100%{opacity:1} }
    @keyframes typeIn6 { 0%,75%{opacity:0} 85%,100%{opacity:1} }
    @keyframes scanV { 0%{transform:translateY(-280px)} 100%{transform:translateY(280px)} }
    .cursor { animation: blink 1s infinite step-end; }
    .line1 { animation: typeIn1 6s infinite ease-out; }
    .line2 { animation: typeIn2 6s infinite ease-out; }
    .line3 { animation: typeIn3 6s infinite ease-out; }
    .line4 { animation: typeIn4 6s infinite ease-out; }
    .line5 { animation: typeIn5 6s infinite ease-out; }
    .line6 { animation: typeIn6 6s infinite ease-out; }
    .scan-v { animation: scanV 5s infinite linear; }
  </style>

  <rect width="900" height="280" rx="16" fill="url(#termBg)"/>
  <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#00ff9c" stroke-width="1" opacity="0.4"/>

  <!-- Vertical scanline -->
  <rect x="0" y="0" width="900" height="1" fill="#00ff9c" opacity="0.1" class="scan-v"/>

  <!-- Terminal top bar -->
  <rect x="0" y="0" width="900" height="38" rx="15" fill="#0a0a0a"/>
  <rect x="0" y="25" width="900" height="13" fill="#0a0a0a"/>
  <circle cx="28" cy="19" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="19" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="19" r="7" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#5f5f5f" letter-spacing="4">SYSTEM MANIFESTO — TERMINAL</text>

  <!-- Terminal Content -->
  <g font-family="Share Tech Mono,monospace" font-size="12">
    <!-- Prompt 1 -->
    <text x="30" y="70" class="line1">
      <tspan fill="#7d7dff">mr.fool</tspan><tspan fill="#5f5f5f">@</tspan><tspan fill="#ff3fa4">watashiwa01</tspan><tspan fill="#5f5f5f">:~$ </tspan><tspan fill="#eafff0">cat manifesto.txt</tspan>
    </text>

    <!-- Manifesto lines -->
    <text x="30" y="100" fill="#8affc1" class="line2">  I study foundations, not trends.</text>
    <text x="30" y="122" fill="#8affc1" class="line3">  In security, think like the attacker to build the defender.</text>
    <text x="30" y="144" fill="#8affc1" class="line4">  In blockchain, trustless systems are just trust — redesigned.</text>
    <text x="30" y="166" fill="#8affc1" class="line5">  In AI, the amplifier is only as good as the mind behind it.</text>
    <text x="30" y="188" fill="#00ff9c" class="line6">  Let them think the fool. The system already knows the rank.</text>

    <!-- Prompt 2 -->
    <text x="30" y="218" class="line6">
      <tspan fill="#7d7dff">mr.fool</tspan><tspan fill="#5f5f5f">@</tspan><tspan fill="#ff3fa4">watashiwa01</tspan><tspan fill="#5f5f5f">:~$ </tspan><tspan fill="#eafff0">ping future.io</tspan>
    </text>

    <text x="30" y="244" fill="#00ff9c" class="line6">  64 bytes from destiny: ttl=∞  time=0ms</text>

    <!-- Final Prompt with blinking cursor -->
    <text x="30" y="268">
      <tspan fill="#7d7dff">mr.fool</tspan><tspan fill="#5f5f5f">@</tspan><tspan fill="#ff3fa4">watashiwa01</tspan><tspan fill="#5f5f5f">:~$ </tspan>
      <tspan fill="#00ff9c" class="cursor">█</tspan>
    </text>
  </g>
</svg>
