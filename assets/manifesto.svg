<svg width="900" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050008"/>
      <stop offset="100%" stop-color="#0a0012"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes t1 { 0%,5%{opacity:0} 15%,100%{opacity:1} }
    @keyframes t2 { 0%,20%{opacity:0} 30%,100%{opacity:1} }
    @keyframes t3 { 0%,35%{opacity:0} 45%,100%{opacity:1} }
    @keyframes t4 { 0%,50%{opacity:0} 60%,100%{opacity:1} }
    @keyframes t5 { 0%,65%{opacity:0} 75%,100%{opacity:1} }
    @keyframes t6 { 0%,80%{opacity:0} 90%,100%{opacity:1} }
    @keyframes scanT { 0%{transform:translateY(-290px)} 100%{transform:translateY(290px)} }
    .cur { animation: blink 0.9s infinite step-end; }
    .l1 { animation: t1 7s infinite ease-out; }
    .l2 { animation: t2 7s infinite ease-out; }
    .l3 { animation: t3 7s infinite ease-out; }
    .l4 { animation: t4 7s infinite ease-out; }
    .l5 { animation: t5 7s infinite ease-out; }
    .l6 { animation: t6 7s infinite ease-out; }
    .sc { animation: scanT 6s infinite linear; }
  </style>
  <rect width="900" height="290" rx="16" fill="url(#termBg)"/>
  <rect x="1" y="1" width="898" height="288" rx="15" fill="none" stroke="#6a0dad" stroke-width="1" opacity="0.5"/>

  <!-- Scanline -->
  <rect x="0" y="0" width="900" height="1" fill="#6a0dad" opacity="0.15" class="sc"/>

  <!-- Title bar -->
  <rect width="900" height="40" rx="15" fill="#0a000f"/>
  <rect y="28" width="900" height="12" fill="#0a000f"/>
  <circle cx="26" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="20" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="20" r="7" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#4b0082" letter-spacing="4">SYSTEM MANIFESTO — LELOUCH vi BRITANNIA</text>

  <!-- Terminal lines -->
  <g font-family="Share Tech Mono,monospace" font-size="12.5">
    <text x="32" y="70" class="l1">
      <tspan fill="#6a0dad">zero</tspan><tspan fill="#444">@</tspan><tspan fill="#8b0000">watashiwa01</tspan><tspan fill="#444">:~$ </tspan><tspan fill="#e0e0e0">cat /strategy/manifesto.conf</tspan>
    </text>
    <text x="32" y="102" fill="#b39ddb" class="l2">  I study the board, not the pieces.</text>
    <text x="32" y="126" fill="#b39ddb" class="l3">  In security, the attacker who knows the board wins.</text>
    <text x="32" y="150" fill="#b39ddb" class="l4">  In blockchain, trustless means you redesigned the trust.</text>
    <text x="32" y="174" fill="#b39ddb" class="l5">  In AI, the weapon is only as sharp as the wielder.</text>
    <text x="32" y="198" fill="#e040fb" class="l6">  If the king does not lead, how can his code ever ship?</text>
    <text x="32" y="228" class="l6">
      <tspan fill="#6a0dad">zero</tspan><tspan fill="#444">@</tspan><tspan fill="#8b0000">watashiwa01</tspan><tspan fill="#444">:~$ </tspan><tspan fill="#e0e0e0">./execute --plan zero</tspan>
    </text>
    <text x="32" y="254" fill="#dc143c" class="l6">  All according to plan.</text>
    <text x="32" y="278">
      <tspan fill="#6a0dad">zero</tspan><tspan fill="#444">@</tspan><tspan fill="#8b0000">watashiwa01</tspan><tspan fill="#444">:~$ </tspan><tspan fill="#9b59b6" class="cur">█</tspan>
    </text>
  </g>
</svg>
