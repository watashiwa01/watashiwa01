<svg width="100%" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradients -->
    <linearGradient id="frontsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030007"/>
      <stop offset="100%" stop-color="#0a0018"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09001b"/>
      <stop offset="100%" stop-color="#00180a"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140026"/>
      <stop offset="100%" stop-color="#000d1b"/>
    </linearGradient>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0014"/>
      <stop offset="100%" stop-color="#0b0024"/>
    </linearGradient>

    <!-- Grid pattern for card textures -->
    <pattern id="cardGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.05"/>
    </pattern>

    <!-- Card Glow Filters -->
    <filter id="c1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes borderPulse1 { 0%, 100% { stroke: #00ff9c; opacity: 0.6; } 50% { stroke: #00c2ff; opacity: 1; } }
    @keyframes borderPulse2 { 0%, 100% { stroke: #ff3fa4; opacity: 0.6; } 50% { stroke: #7d7dff; opacity: 1; } }
    @keyframes borderPulse3 { 0%, 100% { stroke: #ffd166; opacity: 0.6; } 50% { stroke: #00ff9c; opacity: 1; } }
    
    @keyframes holographicTilt {
      0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
      50% { transform: translateY(-5px) rotateX(2deg) rotateY(1.5deg); }
    }
    @keyframes syncSweep {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateX(840px); opacity: 0; }
    }

    .card-grp-1 { transform-origin: 150px 135px; animation: holographicTilt 6s infinite ease-in-out; }
    .card-grp-2 { transform-origin: 450px 135px; animation: holographicTilt 6s infinite ease-in-out; animation-delay: 2s; }
    .card-grp-3 { transform-origin: 750px 135px; animation: holographicTilt 6s infinite ease-in-out; animation-delay: 4s; }

    .c1-border { animation: borderPulse1 2.5s infinite ease-in-out; }
    .c2-border { animation: borderPulse2 2.5s infinite ease-in-out; }
    .c3-border { animation: borderPulse3 2.5s infinite ease-in-out; }

    .sync-line { animation: syncSweep 6s infinite linear; }
  </style>

  <!-- Background -->
  <rect width="900" height="250" rx="16" fill="url(#frontsBg)"/>
  <rect x="1.5" y="1.5" width="897" height="247" rx="15" fill="none" stroke="#221a3a" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#00ff9c" letter-spacing="8" opacity="0.9" font-weight="bold">
    THE THREE FRONTS — COGNITIVE ALCHEMY
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <line x1="30" y1="45" x2="870" y2="45" stroke="#00ff9c" stroke-width="0.5" opacity="0.25"/>

  <!-- CARD 1: AI/ML -->
  <g transform="translate(30, 60)" class="card-grp-1">
    <rect width="240" height="155" rx="12" fill="url(#cardBg1)" stroke="#00ff9c" stroke-width="1.5" class="c1-border" filter="url(#c1Glow)"/>
    <!-- Grid overlay texture -->
    <rect width="240" height="155" rx="12" fill="url(#cardGrid)"/>
    
    <!-- Sweeper stream inside card -->
    <rect x="0" y="0" width="240" height="3" rx="1.5" fill="#00ff9c" opacity="0.2">
      <animate attributeName="y" values="-5;160;-5" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Custom Drawn AI Brain/Network Icon -->
    <g transform="translate(120, 36)" opacity="0.95">
      <!-- Network Nodes -->
      <circle cx="-15" cy="-8" r="3" fill="#00ff9c"/>
      <circle cx="15" cy="-8" r="3" fill="#00ff9c"/>
      <circle cx="-22" cy="8" r="3.5" fill="#00c2ff"/>
      <circle cx="22" cy="8" r="3.5" fill="#00c2ff"/>
      <circle cx="0" cy="18" r="4.5" fill="#eafff0"/>
      <!-- Network Lines -->
      <line x1="-15" y1="-8" x2="0" y2="18" stroke="#00ff9c" stroke-width="1"/>
      <line x1="15" y1="-8" x2="0" y2="18" stroke="#00ff9c" stroke-width="1"/>
      <line x1="-22" y1="8" x2="0" y2="18" stroke="#00c2ff" stroke-width="1"/>
      <line x1="22" y1="8" x2="0" y2="18" stroke="#00c2ff" stroke-width="1"/>
      <line x1="-15" y1="-8" x2="-22" y2="8" stroke="#fff" stroke-width="0.75" opacity="0.6"/>
      <line x1="15" y1="-8" x2="22" y2="8" stroke="#fff" stroke-width="0.75" opacity="0.6"/>
    </g>

    <text x="120" y="66" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#00ff9c" letter-spacing="3" font-weight="bold">COGNITIVE ALCHEMY</text>
    <text x="120" y="82" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#5aff9c" opacity="0.7">neural networks · LLM · agents</text>
    
    <!-- Progress Bar -->
    <rect x="25" y="100" width="190" height="7" rx="3.5" fill="#06030c"/>
    <rect x="25" y="100" height="7" rx="3.5" fill="#00ff9c">
      <animate attributeName="width" values="0;167;167;0" keyTimes="0;0.3;0.8;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    
    <text x="120" y="128" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="20" fill="#eafff0">88%</text>
    <text x="120" y="142" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#00ff9c" opacity="0.6">RESONANCE LEVEL</text>
  </g>

  <!-- CARD 2: Cybersecurity -->
  <g transform="translate(330, 60)" class="card-grp-2">
    <rect width="240" height="155" rx="12" fill="url(#cardBg2)" stroke="#ff3fa4" stroke-width="1.5" class="c2-border" filter="url(#c1Glow)"/>
    <rect width="240" height="155" rx="12" fill="url(#cardGrid)"/>
    
    <rect x="0" y="0" width="240" height="3" rx="1.5" fill="#ff3fa4" opacity="0.2">
      <animate attributeName="y" values="-5;160;-5" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Custom Shield/Security Cyber Icon -->
    <g transform="translate(120, 36)" opacity="0.95">
      <!-- Shield shape -->
      <path d="M -15 -12 L 15 -12 L 15 -2 Q 15 12 0 18 Q -15 12 -15 -2 Z" fill="none" stroke="#ff3fa4" stroke-width="2"/>
      <!-- Inner lock element -->
      <rect x="-6" y="-3" width="12" height="10" rx="2" fill="#7d7dff"/>
      <path d="M -3 -3 L -3 -8 Q 0 -12 3 -8 L 3 -3" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>

    <text x="120" y="66" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#ff3fa4" letter-spacing="3" font-weight="bold">DEFENSIVE OFFENSE</text>
    <text x="120" y="82" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#ff9acb" opacity="0.7">offense theory · defense arch</text>
    
    <!-- Progress Bar -->
    <rect x="25" y="100" width="190" height="7" rx="3.5" fill="#06030c"/>
    <rect x="25" y="100" height="7" rx="3.5" fill="#ff3fa4">
      <animate attributeName="width" values="0;142;142;0" keyTimes="0;0.3;0.8;1" dur="6s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    
    <text x="120" y="128" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="20" fill="#eafff0">75%</text>
    <text x="120" y="142" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#ff3fa4" opacity="0.6">RESONANCE LEVEL</text>
  </g>

  <!-- CARD 3: Blockchain -->
  <g transform="translate(630, 60)" class="card-grp-3">
    <rect width="240" height="155" rx="12" fill="url(#cardBg3)" stroke="#ffd166" stroke-width="1.5" class="c3-border" filter="url(#c1Glow)"/>
    <rect width="240" height="155" rx="12" fill="url(#cardGrid)"/>
    
    <rect x="0" y="0" width="240" height="3" rx="1.5" fill="#ffd166" opacity="0.2">
      <animate attributeName="y" values="-5;160;-5" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Custom Blockchain Chain Link Icon -->
    <g transform="translate(120, 36)" opacity="0.95">
      <!-- Two intertwined links -->
      <rect x="-16" y="-8" width="18" height="10" rx="3" fill="none" stroke="#ffd166" stroke-width="2" transform="rotate(-30)"/>
      <rect x="-2" y="-4" width="18" height="10" rx="3" fill="none" stroke="#ffd166" stroke-width="2" transform="rotate(30)"/>
      <circle cx="-18" cy="8" r="2" fill="#ffd166"/>
      <circle cx="18" cy="-8" r="2" fill="#00ff9c"/>
    </g>

    <text x="120" y="66" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#ffd166" letter-spacing="3" font-weight="bold">TRUSTLESS RAILS</text>
    <text x="120" y="82" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#ffe9a0" opacity="0.7">smart contracts · DeFi security</text>
    
    <!-- Progress Bar -->
    <rect x="25" y="100" width="190" height="7" rx="3.5" fill="#06030c"/>
    <rect x="25" y="100" height="7" rx="3.5" fill="#ffd166">
      <animate attributeName="width" values="0;129;129;0" keyTimes="0;0.3;0.8;1" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    
    <text x="120" y="128" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="20" fill="#eafff0">68%</text>
    <text x="120" y="142" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#ffd166" opacity="0.6">RESONANCE LEVEL</text>
  </g>

  <!-- Global sync scanner sweep lines that cross all three cards -->
  <line x1="30" y1="55" x2="30" y2="215" stroke="#00ff9c" stroke-width="1.5" opacity="0.6" class="sync-line"/>

  <!-- Bottom note -->
  <text x="450" y="236" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#5f5f5f" letter-spacing="2">
    [ anomaly lies not in any single path — but in their intersection ]
  </text>
</svg>
