<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0018"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="gSeal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes outerSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes innerSpin { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
    @keyframes chessPulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
    @keyframes closePulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
    .spin-o { transform-origin: 450px 87px; animation: outerSpin 28s infinite linear; }
    .spin-i { transform-origin: 450px 87px; animation: innerSpin 18s infinite linear; }
    .king-pulse { animation: chessPulse 3s infinite ease-in-out; }
    .cap { animation: closePulse 4s infinite ease-in-out; }
  </style>

  <rect width="900" height="180" fill="url(#sealBg)"/>

  <!-- Outer ring -->
  <circle cx="450" cy="87" r="70" fill="none" stroke="#6a0dad" stroke-width="1.2" stroke-dasharray="10 15" class="spin-o" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="450" cy="87" r="55" fill="none" stroke="#dc143c" stroke-width="1" stroke-dasharray="4 10" class="spin-i" opacity="0.5"/>
  <!-- Core -->
  <circle cx="450" cy="87" r="38" fill="none" stroke="#4b0082" stroke-width="0.6" opacity="0.4"/>

  <!-- King chess piece center -->
  <text x="450" y="103" text-anchor="middle" font-family="serif" font-size="44" fill="#ffd700" filter="url(#gSeal)" class="king-pulse">♔</text>

  <!-- Left quote -->
  <text x="58"  y="72" font-family="Share Tech Mono,monospace" font-size="10" fill="#9b59b6" text-anchor="middle">A king does not</text>
  <text x="58"  y="88" font-family="Share Tech Mono,monospace" font-size="10" fill="#9b59b6" text-anchor="middle">need to explain</text>
  <text x="58"  y="104" font-family="Share Tech Mono,monospace" font-size="10" fill="#9b59b6" text-anchor="middle">his moves.</text>
  <text x="58"  y="122" font-family="Share Tech Mono,monospace" font-size="9" fill="#444" text-anchor="middle">— Klein Moretti</text>

  <!-- Right quote -->
  <text x="842" y="72" font-family="Share Tech Mono,monospace" font-size="10" fill="#c0392b" text-anchor="middle">The board</text>
  <text x="842" y="88" font-family="Share Tech Mono,monospace" font-size="10" fill="#c0392b" text-anchor="middle">speaks for</text>
  <text x="842" y="104" font-family="Share Tech Mono,monospace" font-size="10" fill="#c0392b" text-anchor="middle">itself.</text>
  <text x="842" y="122" font-family="Share Tech Mono,monospace" font-size="9" fill="#444" text-anchor="middle">— Mr. Fool</text>

  <!-- Bottom tagline -->
  <text x="450" y="160" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10" fill="#4b0082" letter-spacing="4" class="cap">
    ♟  ALL ACCORDING TO PLAN  ♟
  </text>
</svg>
