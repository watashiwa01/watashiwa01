<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0018"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="gSeal">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes sealSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes sealSpinR { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
    @keyframes sealPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
    .outer-ring { transform-origin: 450px 90px; animation: sealSpin 30s infinite linear; }
    .inner-ring { transform-origin: 450px 90px; animation: sealSpinR 20s infinite linear; }
    .seal-pulse { animation: sealPulse 3s infinite ease-in-out; }
  </style>

  <rect width="900" height="180" rx="16" fill="url(#sealBg)"/>

  <!-- Outer rune ring -->
  <circle cx="450" cy="90" r="75" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="8 12" class="outer-ring" opacity="0.5"/>
  <!-- Inner rune ring -->
  <circle cx="450" cy="90" r="60" fill="none" stroke="#00ff9c" stroke-width="1" stroke-dasharray="4 8" class="inner-ring" opacity="0.6"/>
  <!-- Core circle -->
  <circle cx="450" cy="90" r="45" fill="none" stroke="#ff3fa4" stroke-width="1" opacity="0.4" class="seal-pulse"/>
  <!-- Center glyph -->
  <text x="450" y="100" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="36" fill="#ffd166" filter="url(#gSeal)" class="seal-pulse">🜏</text>

  <!-- Left text -->
  <text x="50" y="75" font-family="Share Tech Mono,monospace" font-size="11" fill="#8affc1" text-anchor="middle">Klein Moretti</text>
  <text x="50" y="95" font-family="Share Tech Mono,monospace" font-size="9" fill="#5f5f5f" text-anchor="middle">keeps the system</text>
  <text x="50" y="112" font-family="Share Tech Mono,monospace" font-size="9" fill="#5f5f5f" text-anchor="middle">understandable</text>
  <text x="50" y="129" font-family="Share Tech Mono,monospace" font-size="9" fill="#5f5f5f" text-anchor="middle">enough to exist.</text>

  <!-- Right text -->
  <text x="850" y="75" font-family="Share Tech Mono,monospace" font-size="11" fill="#ff3fa4" text-anchor="middle">Mr. Fool</text>
  <text x="850" y="95" font-family="Share Tech Mono,monospace" font-size="9" fill="#5f5f5f" text-anchor="middle">keeps it strange</text>
  <text x="850" y="112" font-family="Share Tech Mono,monospace" font-size="9" fill="#5f5f5f" text-anchor="middle">enough to</text>
  <text x="850" y="129" font-family="Share Tech Mono,monospace" font-size="9" fill="#5f5f5f" text-anchor="middle">survive.</text>

  <!-- Bottom caption -->
  <text x="450" y="158" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10" fill="#3f3f3f" letter-spacing="3">
    THIS IS NOT YOUR PROFILE. THIS IS WHAT THEY WILL REMEMBER.
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
