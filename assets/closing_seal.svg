<svg width="100%" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b0122"/>
      <stop offset="60%" stop-color="#030009"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Multi-color aurora glow filter for the central glyph -->
    <filter id="auroraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.8
        0 1 0 0 0.1
        0 0 1 0 0.9
        0 0 0 1 0" in="blur2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinCW { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes spinCCW { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
    @keyframes pulseAurora { 0%,100%{opacity:0.7; filter:url(#auroraGlow) drop-shadow(0 0 2px #ff3fa4);} 50%{opacity:1; filter:url(#auroraGlow) drop-shadow(0 0 15px #00ff9c);} }
    @keyframes pulseDualityText { 0%,100%{opacity:0.5;} 50%{opacity:0.95;} }

    .ring-1 { transform-origin: 450px 90px; animation: spinCW 40s infinite linear; }
    .ring-2 { transform-origin: 450px 90px; animation: spinCCW 32s infinite linear; }
    .ring-3 { transform-origin: 450px 90px; animation: spinCW 24s infinite linear; }
    .ring-4 { transform-origin: 450px 90px; animation: spinCCW 18s infinite linear; }
    .ring-5 { transform-origin: 450px 90px; animation: spinCW 12s infinite linear; }

    .seal-core { animation: pulseAurora 4s infinite ease-in-out; }
    .lore-text { animation: pulseDualityText 3s infinite ease-in-out; }
  </style>

  <rect width="900" height="180" rx="16" fill="url(#sealBg)"/>

  <!-- Orbital Seal Rings (5 layers total) -->
  <!-- Ring 1 (Outermost): dasharray with dots -->
  <circle cx="450" cy="90" r="85" fill="none" stroke="#ffd166" stroke-width="0.75" stroke-dasharray="10 15" class="ring-1" opacity="0.4"/>
  <!-- Ring 2: CCW solid thin line with micro markers -->
  <circle cx="450" cy="90" r="74" fill="none" stroke="#7d7dff" stroke-width="0.5" class="ring-2" opacity="0.6"/>
  <g class="ring-2" opacity="0.7">
    <circle cx="450" cy="16" r="1.5" fill="#7d7dff"/>
    <circle cx="450" cy="164" r="1.5" fill="#7d7dff"/>
    <circle cx="376" cy="90" r="1.5" fill="#7d7dff"/>
    <circle cx="524" cy="90" r="1.5" fill="#7d7dff"/>
  </g>

  <!-- Ring 3: CW with long dashes -->
  <circle cx="450" cy="90" r="63" fill="none" stroke="#ff3fa4" stroke-width="1.2" stroke-dasharray="40 20" class="ring-3" opacity="0.5"/>
  <!-- Ring 4: CCW with short dashes -->
  <circle cx="450" cy="90" r="52" fill="none" stroke="#00ff9c" stroke-width="1" stroke-dasharray="4 8" class="ring-4" opacity="0.6"/>
  
  <!-- Ring 5 (Innermost): Solid thin boundary ring -->
  <circle cx="450" cy="90" r="41" fill="none" stroke="#ffd166" stroke-width="0.75" class="ring-5" opacity="0.5"/>

  <!-- Core Seal Center Glyph -->
  <g class="seal-core">
    <text x="450" y="103" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="40" fill="#ffd166" font-weight="bold">🜏</text>
  </g>

  <!-- Left Side Lore (Klein) -->
  <g transform="translate(180, 0)">
    <text x="0" y="65" font-family="Share Tech Mono, monospace" font-size="12" fill="#8affc1" text-anchor="middle" font-weight="bold" class="lore-text">KLEIN MORETTI</text>
    <path d="M -70 75 L 70 75" stroke="#00ff9c" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="94" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle">Anchors the system structure</text>
    <text x="0" y="112" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle">Refuses to let the memory die</text>
    <text x="0" y="130" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#5f5f5f" text-anchor="middle">so that reality can remain consistent.</text>
  </g>

  <!-- Right Side Lore (Fool) -->
  <g transform="translate(720, 0)">
    <text x="0" y="65" font-family="Share Tech Mono, monospace" font-size="12" fill="#ff3fa4" text-anchor="middle" font-weight="bold" class="lore-text" style="animation-delay: 1.5s;">MR. FOOL</text>
    <path d="M -70 75 L 70 75" stroke="#ff3fa4" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="94" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle">Shatters absolute stability</text>
    <text x="0" y="112" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle">Injects anomalies and noise</text>
    <text x="0" y="130" font-family="Share Tech Mono, monospace" font-size="9.5" fill="#5f5f5f" text-anchor="middle">so that the myth can remain eternal.</text>
  </g>

  <!-- Bottom caption -->
  <g transform="translate(450, 160)">
    <text text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#5f5f5f" letter-spacing="3" font-weight="bold">
      THIS IS NOT YOUR PROFILE. THIS IS WHAT REMAINS.
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
