<svg width="100%" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="questBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#0f001b"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseProgress { 0%,100%{opacity:0.4; fill:#ff3fa4;} 50%{opacity:1; fill:#ff0077;} }
    @keyframes drawCheck { 0%{stroke-dashoffset: 20;} 100%{stroke-dashoffset: 0;} }
    @keyframes glowTimeline { 0%,100%{opacity:0.3; stroke:#7d7dff;} 50%{opacity:0.7; stroke:#ff3fa4;} }
    
    .timeline-line { animation: glowTimeline 5s infinite ease-in-out; }
    .pulse-prog { animation: pulseProgress 2.5s infinite ease-in-out; }
    
    /* Checkmark drawing effect */
    .chk-path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: drawCheck 1.5s ease-out forwards; }
  </style>

  <!-- Container Base -->
  <rect width="900" height="320" rx="16" fill="url(#questBg)"/>
  <rect x="1" y="1" width="898" height="318" rx="15" fill="none" stroke="#7d7dff" stroke-width="1.2" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0 2440;2440 0" dur="4s" fill="freeze"/>
  </rect>

  <!-- Title -->
  <g transform="translate(450, 35)">
    <text text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#7d7dff" letter-spacing="8" font-weight="bold">
      THE ASCENSION PROTOCOL — ACTIVE QUESTS
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  <line x1="30" y1="48" x2="870" y2="48" stroke="#7d7dff" stroke-width="0.5" opacity="0.3"/>

  <!-- Subheaders (Season & EXP) -->
  <text x="50" y="68" font-family="Share Tech Mono, monospace" font-size="10" fill="#5f5f5f" letter-spacing="2">SEASON I: FOOL'S ASCENT</text>
  
  <g transform="translate(620, 68)" font-family="Share Tech Mono, monospace" font-size="10" fill="#7d7dff" font-weight="bold">
    <text x="0" y="0">SEQUENCE: SCHOLAR [SEQ.3] | EXP: 84.6%</text>
    <rect x="-10" y="8" width="240" height="4" rx="2" fill="#080313"/>
    <rect x="-10" y="8" width="203" height="4" rx="2" fill="#7d7dff"/>
  </g>

  <!-- Timeline Vertical Connector Line -->
  <line x1="45" y1="90" x2="45" y2="295" stroke="#7d7dff" stroke-width="1.5" opacity="0.4" class="timeline-line"/>

  <!-- Quest 1: Completed -->
  <g transform="translate(30, 85)">
    <!-- Timeline Node -->
    <circle cx="15" cy="10" r="5" fill="#00ff9c" filter="url(#greenGlow)"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#00ff9c" opacity="0.04"/>
    
    <!-- Animated Check icon -->
    <path d="M 45 11 L 49 15 L 56 6" fill="none" stroke="#00ff9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chk-path"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#8affc1">Unravel Python → materialize initial neural networks</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#00ff9c">ARCHIVED</text>
  </g>

  <!-- Quest 2: Completed -->
  <g transform="translate(30, 115)">
    <!-- Timeline Node -->
    <circle cx="15" cy="10" r="5" fill="#00ff9c" filter="url(#greenGlow)"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#00ff9c" opacity="0.04"/>
    
    <path d="M 45 11 L 49 15 L 56 6" fill="none" stroke="#00ff9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chk-path" style="animation-delay: 0.3s;"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#8affc1">Forge full-stack intelligent agent architectures</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#00ff9c">ARCHIVED</text>
  </g>

  <!-- Quest 3: Completed -->
  <g transform="translate(30, 145)">
    <!-- Timeline Node -->
    <circle cx="15" cy="10" r="5" fill="#00ff9c" filter="url(#greenGlow)"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#00ff9c" opacity="0.04"/>
    
    <path d="M 45 11 L 49 15 L 56 6" fill="none" stroke="#00ff9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chk-path" style="animation-delay: 0.6s;"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#8affc1">Infiltrate cybersecurity matrices and ledger fundamentals</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#00ff9c">ARCHIVED</text>
  </g>

  <!-- Quest 4: In Progress -->
  <g transform="translate(30, 175)">
    <!-- Timeline Node -->
    <polygon points="15,4 21,10 15,16 9,10" fill="#ff3fa4" filter="url(#pinkGlow)" class="pulse-prog"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#ff3fa4" opacity="0.05">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Active Diamond icon -->
    <polygon points="49,5 53,10 49,15 45,10" fill="none" stroke="#ff3fa4" stroke-width="1.5" class="pulse-prog"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#eafff0">Construct a production-grade autonomous engine</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#ff3fa4" font-weight="bold">IN_PROGRESS</text>
  </g>

  <!-- Quest 5: In Progress -->
  <g transform="translate(30, 205)">
    <!-- Timeline Node -->
    <polygon points="15,4 21,10 15,16 9,10" fill="#ff3fa4" filter="url(#pinkGlow)" class="pulse-prog" style="animation-delay: 0.5s;"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#ff3fa4" opacity="0.05">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="2s" style="animation-delay: 0.5s;" repeatCount="indefinite"/>
    </rect>
    
    <polygon points="49,5 53,10 49,15 45,10" fill="none" stroke="#ff3fa4" stroke-width="1.5" class="pulse-prog"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#eafff0">Map smart-contract exploits &amp; DeFi vulnerability matrices</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#ff3fa4" font-weight="bold">IN_PROGRESS</text>
  </g>

  <!-- Quest 6: Locked -->
  <g transform="translate(30, 235)">
    <!-- Timeline Node -->
    <circle cx="15" cy="10" r="4" fill="#333"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#5f5f5f" opacity="0.02"/>
    
    <!-- Lock icon representation -->
    <rect x="46" y="9" width="7" height="6" rx="1" fill="#444"/>
    <path d="M 47 9 L 47 7 Q 49.5 5 52 7 L 52 9" fill="none" stroke="#444" stroke-width="1"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#5f5f5f">Deploy autonomous AI systems on trustless infrastructure</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#5f5f5f">LOCKED</text>
  </g>

  <!-- Quest 7: Locked -->
  <g transform="translate(30, 265)">
    <!-- Timeline Node -->
    <circle cx="15" cy="10" r="4" fill="#333"/>
    
    <rect x="35" y="0" width="805" height="22" rx="4" fill="#5f5f5f" opacity="0.02"/>
    
    <rect x="46" y="9" width="7" height="6" rx="1" fill="#444"/>
    <path d="M 47 9 L 47 7 Q 49.5 5 52 7 L 52 9" fill="none" stroke="#444" stroke-width="1"/>
    
    <text x="65" y="15" font-family="Share Tech Mono, monospace" font-size="11.5" fill="#5f5f5f">Pioneer a new protocol in human-computer alignment</text>
    <text x="760" y="15" font-family="Share Tech Mono, monospace" font-size="9" fill="#5f5f5f">LOCKED</text>
  </g>
</svg>
