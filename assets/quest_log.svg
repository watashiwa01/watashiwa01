    .inprog { animation: prg 1.8s infinite ease-in-out; }
    .locked { animation: lck 3s infinite ease-in-out; }
  </style>

  <rect width="900" height="300" rx="16" fill="url(#questBg)"/>
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="#4b0082" stroke-width="1" opacity="0.6">
