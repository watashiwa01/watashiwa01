<svg width="100%" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradients -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020005">
        <animate attributeName="stop-color" values="#020005;#0a0114;#000806;#020005" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#060010">
        <animate attributeName="stop-color" values="#060010;#01080c;#0c0012;#060010" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#030006;#000301;#000000" dur="15s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Card and Ring Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="50%" stop-color="#00d5ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3fa4"/>
      <stop offset="50%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#7d7dff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="50%" stop-color="#ffa751"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="matrixStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff9c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3fa4" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Divine Glow -->
    <filter id="ultraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes card-float {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-15px) rotate(2deg) scale(1.02); }
    }
    @keyframes pulse-intense {
      0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px #00ff9c); }
      50% { opacity: 0.95; filter: drop-shadow(0 0 12px #00ff9c); }
    }
    @keyframes pulse-pink {
      0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px #ff3fa4); }
      50% { opacity: 0.95; filter: drop-shadow(0 0 12px #ff3fa4); }
    }
    @keyframes scanline {
      0% { transform: translateY(-480px); }
      100% { transform: translateY(480px); }
    }
    @keyframes glitch-text {
      0%, 100% { transform: translate(0, 0); opacity: 0.9; text-shadow: 1px 1px #00ff9c, -1px -1px #ff3fa4; }
      2% { transform: translate(-3px, 2px); opacity: 0.75; text-shadow: 3px -1px #00ff9c, -2px 2px #7d7dff; }
      4% { transform: translate(3px, -2px); opacity: 0.8; text-shadow: -2px 3px #ff3fa4, 2px -1px #00ff9c; }
      6% { transform: translate(0, 0); text-shadow: none; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes worm-drift {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    @keyframes digital-rain {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    /* Target Styles */
    .bg-rect {
      fill: url(#cosmicBg);
    }
    .ring-cw {
      transform-origin: 500px 240px;
      animation: spin-cw 25s infinite linear;
    }
    .ring-ccw {
      transform-origin: 500px 240px;
      animation: spin-ccw 30s infinite linear;
    }
    .ring-fast-cw {
      transform-origin: 500px 240px;
      animation: spin-cw 15s infinite linear;
    }
    .ring-fast-ccw {
      transform-origin: 500px 240px;
      animation: spin-ccw 18s infinite linear;
    }
    .tarot-card-group {
      transform-origin: 500px 240px;
      animation: card-float 7s infinite ease-in-out;
    }
    .scan-bar {
      animation: scanline 9s infinite linear;
    }
    .pulse-element {
      animation: pulse-intense 4s infinite ease-in-out;
    }
    .pulse-pink-el {
      animation: pulse-pink 3s infinite ease-in-out;
    }
    .glitch-active {
      animation: glitch-text 5s infinite steps(2);
    }
    .text-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 32px;
      letter-spacing: 16px;
      font-weight: 700;
      fill: #eafff0;
    }
    .star {
      animation: twinkle 4s infinite ease-in-out;
      transform-origin: center;
    }
    .worm {
      stroke-dasharray: 40 80;
      animation: worm-drift 8s infinite linear;
    }
    .rain-line {
      stroke-dasharray: 100 300;
      animation: digital-rain 6s infinite linear;
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="480" rx="20" class="bg-rect" />

  <!-- Star Field (Static and Twinkling) -->
  <g opacity="0.6">
    <circle cx="100" cy="80" r="1" fill="#fff" class="star" style="animation-delay: 0.5s;" />
    <circle cx="200" cy="180" r="1.5" fill="#fff" class="star" style="animation-delay: 2s;" />
    <circle cx="150" cy="350" r="1" fill="#00ff9c" class="star" style="animation-delay: 1.2s;" />
    <circle cx="280" cy="90" r="2" fill="#ffd166" class="star" style="animation-delay: 3s;" />
    <circle cx="320" cy="380" r="1" fill="#fff" class="star" style="animation-delay: 0.8s;" />
    <circle cx="720" cy="120" r="1.5" fill="#ff3fa4" class="star" style="animation-delay: 2.5s;" />
    <circle cx="850" cy="80" r="1" fill="#fff" class="star" style="animation-delay: 1.7s;" />
    <circle cx="880" cy="320" r="2" fill="#00ff9c" class="star" style="animation-delay: 0.2s;" />
    <circle cx="920" cy="190" r="1.5" fill="#ffd166" class="star" style="animation-delay: 3.5s;" />
    <circle cx="680" cy="360" r="1" fill="#fff" class="star" style="animation-delay: 1.5s;" />
    <circle cx="780" cy="400" r="1.5" fill="#7d7dff" class="star" style="animation-delay: 2.1s;" />
  </g>

  <!-- Vertical Digital Rain Background Strips -->
  <g opacity="0.15">
    <line x1="80" y1="0" x2="80" y2="480" stroke="url(#matrixStream)" stroke-width="1.5" class="rain-line" />
    <line x1="180" y1="0" x2="180" y2="480" stroke="url(#matrixStream)" stroke-width="1" class="rain-line" style="animation-delay: 2s; animation-duration: 4s;" />
    <line x1="820" y1="0" x2="820" y2="480" stroke="url(#matrixStream)" stroke-width="1" class="rain-line" style="animation-delay: 1s; animation-duration: 5s;" />
    <line x1="910" y1="0" x2="910" y2="480" stroke="url(#matrixStream)" stroke-width="1.5" class="rain-line" style="animation-delay: 3s; animation-duration: 7s;" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="10" y="10" width="980" height="460" rx="16" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.6">
    <animate attributeName="stroke" values="#00ff9c;#ff3fa4;#7d7dff;#00ff9c" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Arcane Chronology Ring / Astrolabe -->
  <g opacity="0.35">
    <circle cx="500" cy="240" r="215" fill="none" stroke="url(#neonCyan)" stroke-width="1" stroke-dasharray="12 18" class="ring-cw"/>
    <circle cx="500" cy="240" r="195" fill="none" stroke="url(#neonPink)" stroke-width="2" stroke-dasharray="6 24" class="ring-ccw"/>
    <!-- Orbiting Rune Glyphs -->
    <g class="ring-cw">
      <text x="500" y="40" font-family="Share Tech Mono, monospace" font-size="10" fill="#00ff9c" text-anchor="middle">🜏</text>
      <text x="690" y="245" font-family="Share Tech Mono, monospace" font-size="10" fill="#00ff9c" text-anchor="middle">🜁</text>
      <text x="500" y="445" font-family="Share Tech Mono, monospace" font-size="10" fill="#ff3fa4" text-anchor="middle">🜎</text>
      <text x="310" y="245" font-family="Share Tech Mono, monospace" font-size="10" fill="#ff3fa4" text-anchor="middle">🜍</text>
    </g>
    <circle cx="500" cy="240" r="175" fill="none" stroke="#eafff0" stroke-width="0.75" class="ring-ccw"/>
    <circle cx="500" cy="240" r="160" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="180 90" class="ring-cw"/>
    <circle cx="500" cy="240" r="145" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="3 9" class="ring-fast-ccw"/>
  </g>

  <!-- Left Cyber HUD Readout (Klein / Duality) -->
  <g font-family="Share Tech Mono, monospace" font-size="11" fill="#00ff9c" opacity="0.75" transform="translate(45, 75)">
    <text x="0" y="0" font-weight="bold" fill="#eafff0">SYS.STATE // DRIFT_ONLINE</text>
    <text x="0" y="16">SYS.DUALITY // KLEIN_FOOL</text>
    <path d="M 0 25 L 155 25" stroke="#00ff9c" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="42">PROBABILITY: 0.999781</text>
    <text x="0" y="58">COGNITIVE_DRIFT: STABLE</text>
    <text x="0" y="74">ERROR_ACCUM: [0xFOOL_88]</text>
    <text x="0" y="90">RUNE_LOCK: DECRYPTED</text>
    <text x="0" y="106" fill="#7d7dff">SEQUENCE_PHASE: V</text>
    
    <!-- Live terminal style brackets -->
    <rect x="-12" y="-18" width="185" height="142" fill="none" stroke="#00ff9c" stroke-width="0.75" opacity="0.4"/>
    <path d="M -12 -18 L 12 -18 M -12 -18 L -12 12" stroke="#00ff9c" stroke-width="2"/>
    <path d="M 173 124 L 173 104 M 173 124 L 149 124" stroke="#00ff9c" stroke-width="2"/>
    
    <!-- Pulse diagnostic dot -->
    <circle cx="150" cy="-3" r="3" fill="#00ff9c" class="pulse-element"/>
  </g>

  <!-- Right Cyber HUD Readout (Fool / Ritual) -->
  <g font-family="Share Tech Mono, monospace" font-size="11" fill="#ff3fa4" opacity="0.75" transform="translate(770, 75)">
    <text x="0" y="0" font-weight="bold" fill="#eafff0">MYTH.ENGINE // ACTIVE</text>
    <text x="0" y="16">OBSERVERS // DETECTED</text>
    <path d="M 0 25 L 155 25" stroke="#ff3fa4" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="42">CANON_A: SCHOLAR_TRUE</text>
    <text x="0" y="58">CANON_B: GHOST_TRUE</text>
    <text x="0" y="74">CONTRADICTIONS: UNLOCKED</text>
    <text x="0" y="90">DIVINE_RESONANCE: 94.6%</text>
    <text x="0" y="106" fill="#ffd166">COGNITIVE_GEAS: OFF</text>
    
    <!-- Live terminal style brackets -->
    <rect x="-12" y="-18" width="185" height="142" fill="none" stroke="#ff3fa4" stroke-width="0.75" opacity="0.4"/>
    <path d="M 173 -18 L 149 -18 M 173 -18 L 173 12" stroke="#ff3fa4" stroke-width="2"/>
    <path d="M -12 124 L -12 104 M -12 124 L 12 124" stroke="#ff3fa4" stroke-width="2"/>
    
    <!-- Pulse diagnostic dot -->
    <circle cx="150" cy="-3" r="3" fill="#ff3fa4" class="pulse-pink-el"/>
  </g>

  <!-- Center Floating Tarot Card of the Fool -->
  <g class="tarot-card-group">
    <!-- Card Outer Shadow / Border Glow -->
    <rect x="425" y="100" width="150" height="260" rx="12" fill="#030107" stroke="url(#gold)" stroke-width="3" filter="url(#ultraGlow)"/>
    <rect x="425" y="100" width="150" height="260" rx="12" fill="#070312" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Gothic Card Inner Frame -->
    <rect x="432" y="107" width="136" height="246" rx="9" fill="none" stroke="url(#neonCyan)" stroke-width="1" opacity="0.8"/>
    
    <!-- Micro HUD metrics on the card border -->
    <line x1="432" y1="125" x2="442" y2="125" stroke="url(#gold)" stroke-width="1"/>
    <line x1="558" y1="125" x2="568" y2="125" stroke="url(#gold)" stroke-width="1"/>
    <line x1="432" y1="325" x2="442" y2="325" stroke="url(#gold)" stroke-width="1"/>
    <line x1="558" y1="325" x2="568" y2="325" stroke="url(#gold)" stroke-width="1"/>

    <!-- Roman Numeral "0" at Top of Card -->
    <text x="500" y="130" font-family="Share Tech Mono, monospace" font-size="18" fill="url(#gold)" font-weight="700" text-anchor="middle" letter-spacing="2">0</text>

    <!-- The Divine Mechanical Eye in Center -->
    <g transform="translate(500, 220)">
      <!-- Portal concentric rings -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="url(#neonPink)" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.5"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" class="ring-ccw"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="20 10" class="ring-cw"/>
      
      <!-- Outer Eyelid Shape -->
      <path d="M -32 0 Q 0 -24 32 0 Q 0 24 -32 0 Z" fill="none" stroke="url(#gold)" stroke-width="2.5" filter="url(#subtleGlow)"/>
      
      <!-- Pupil & Iris -->
      <circle cx="0" cy="0" r="14" fill="url(#neonCyan)" opacity="0.8"/>
      <circle cx="0" cy="0" r="7" fill="#020008"/>
      <!-- Slit pupil -->
      <path d="M 0 -9 L 0 9" stroke="url(#gold)" stroke-width="2"/>

      <!-- Spirit Worms / Energy waves surrounding Eye -->
      <path d="M -50 -10 Q -25 -45 0 -10 T 50 -10" fill="none" stroke="url(#neonPink)" stroke-width="1" class="worm" opacity="0.7" />
      <path d="M -50 10 Q -25 45 0 10 T 50 10" fill="none" stroke="url(#neonCyan)" stroke-width="1" class="worm" style="animation-delay: -4s;" opacity="0.7" />
    </g>

    <!-- Text: "THE FOOL" at Bottom of Card -->
    <rect x="445" y="315" width="110" height="20" rx="3" fill="#040108" stroke="url(#gold)" stroke-width="0.5" opacity="0.8"/>
    <text x="500" y="329" font-family="Share Tech Mono, monospace" font-size="11" fill="url(#gold)" letter-spacing="4" text-anchor="middle" font-weight="bold">THE FOOL</text>
  </g>

  <!-- Glowing Horizontal Sweep Scanline (Behind Card Title for clean look) -->
  <line x1="15" y1="0" x2="985" y2="0" stroke="url(#neonCyan)" stroke-width="2" opacity="0.4" class="scan-bar"/>

  <!-- Under-Title HUD Matrix Text -->
  <g transform="translate(500, 395)">
    <text x="0" y="0" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#00ff9c" letter-spacing="6" class="pulse-element">
      [ SYSTEM STATUS: RE-WRITING DESTINY ]
    </text>
  </g>

  <!-- Bottom Interactive / Blinking Command Title -->
  <g transform="translate(500, 440)">
    <text x="0" y="0" text-anchor="middle" class="text-title glitch-active">MR. FOOL</text>
  </g>
</svg>
