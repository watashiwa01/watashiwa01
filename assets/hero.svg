<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050008">
        <animate attributeName="stop-color" values="#050008;#0f0018;#08000a;#050008" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0d0015">
        <animate attributeName="stop-color" values="#0d0015;#05000a;#120018;#0d0015" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="47%" r="35%">
      <stop offset="0%" stop-color="#6a0dad" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowCrimson" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes borderCycle { 0%,100%{stroke:#6a0dad;opacity:0.6} 33%{stroke:#dc143c;opacity:0.9} 66%{stroke:#4b0082;opacity:0.5} }
    @keyframes geassOuter { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes geassInner { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
    @keyframes eyePulse { 0%,100%{opacity:0.1} 50%{opacity:0.35} }
    @keyframes titleGlitch {
      0%,88%,100%{transform:translate(0,0);opacity:1}
      89%{transform:translate(-5px,2px);opacity:0.75}
      91%{transform:translate(5px,-3px);opacity:0.85}
      93%{transform:translate(-3px,1px);opacity:0.9}
      95%{transform:translate(3px,-1px);opacity:0.8}
      97%{transform:translate(0,0);opacity:1}
    }
    @keyframes scanH { 0%{transform:translateY(-430px)} 100%{transform:translateY(430px)} }
    @keyframes scanV { 0%{transform:translateX(-1010px)} 100%{transform:translateX(1010px)} }
    @keyframes chessFloat1 { 0%,100%{transform:translateY(0) rotate(0deg);opacity:0.18} 50%{transform:translateY(-14px) rotate(4deg);opacity:0.45} }
    @keyframes chessFloat2 { 0%,100%{transform:translateY(0) rotate(0deg);opacity:0.15} 50%{transform:translateY(-10px) rotate(-5deg);opacity:0.4} }
    @keyframes chessFloat3 { 0%,100%{transform:translateY(0) rotate(0deg);opacity:0.12} 50%{transform:translateY(-18px) rotate(6deg);opacity:0.35} }
    @keyframes roseFloat1 { 0%{transform:translateY(0) rotate(0deg) scale(1);opacity:0} 5%{opacity:0.7} 90%{opacity:0.3} 100%{transform:translateY(-380px) rotate(200deg) scale(0.5);opacity:0} }
    @keyframes roseFloat2 { 0%{transform:translateY(0) rotate(20deg) scale(0.8);opacity:0} 8%{opacity:0.5} 92%{opacity:0.2} 100%{transform:translateY(-400px) rotate(-160deg) scale(0.3);opacity:0} }
    @keyframes hudFlicker { 0%,100%{opacity:0.5} 50%{opacity:0.9} }
    @keyframes subtitlePulse { 0%,100%{opacity:0.55} 50%{opacity:1} }
    @keyframes gridScroll { 0%{transform:perspective(500px) rotateX(45deg) translateY(0)} 100%{transform:perspective(500px) rotateX(45deg) translateY(-60px)} }
    @keyframes signaturePulse { 0%,100%{opacity:0.35} 50%{opacity:0.75} }

    .border-animate { animation: borderCycle 5s infinite ease-in-out; }
    .geass-outer { transform-origin: 500px 195px; animation: geassOuter 35s infinite linear; }
    .geass-inner { transform-origin: 500px 195px; animation: geassInner 22s infinite linear; }
    .eye-bg { animation: eyePulse 5s infinite ease-in-out; }
    .title-main { animation: titleGlitch 6s infinite; }
    .scan-h { animation: scanH 8s infinite linear; }
    .scan-v { animation: scanV 12s infinite linear; }
    .cf1 { animation: chessFloat1 5s infinite ease-in-out; }
    .cf2 { animation: chessFloat2 6.5s infinite ease-in-out 1.5s; }
    .cf3 { animation: chessFloat3 8s infinite ease-in-out 3s; }
    .rose1 { transform-origin: 70px 420px; animation: roseFloat1 10s infinite ease-in-out; }
    .rose2 { transform-origin: 930px 420px; animation: roseFloat2 13s infinite ease-in-out 3s; }
    .rose3 { transform-origin: 200px 420px; animation: roseFloat1 15s infinite ease-in-out 6s; }
    .rose4 { transform-origin: 800px 420px; animation: roseFloat2 11s infinite ease-in-out 8s; }
    .hud { animation: hudFlicker 2.5s infinite ease-in-out; }
    .subtitle { animation: subtitlePulse 3s infinite ease-in-out; }
    .grid-scroll { animation: gridScroll 4s infinite linear; }
    .sig { animation: signaturePulse 4s infinite ease-in-out; }
  </style>

  <!-- Base background -->
  <rect width="1000" height="420" fill="url(#bgGrad)"/>
  <!-- Center radial glow -->
  <rect width="1000" height="420" fill="url(#centerGlow)"/>

  <!-- Perspective chess grid floor -->
  <g class="grid-scroll" opacity="0.08">
    <line x1="500" y1="265" x2="-100" y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="50"   y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="180"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="300"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="400"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="500"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="600"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="700"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="820"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="950"  y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="500" y1="265" x2="1100" y2="420" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="-200" y1="310" x2="1200" y2="310" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="-200" y1="340" x2="1200" y2="340" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="-200" y1="365" x2="1200" y2="365" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="-200" y1="388" x2="1200" y2="388" stroke="#6a0dad" stroke-width="0.6"/>
    <line x1="-200" y1="408" x2="1200" y2="408" stroke="#6a0dad" stroke-width="0.6"/>
  </g>

  <!-- Outer border -->
  <rect x="8" y="8" width="984" height="404" rx="18" fill="none" stroke="#6a0dad" stroke-width="2" class="border-animate"/>
  <!-- Inner border -->
  <rect x="18" y="18" width="964" height="384" rx="12" fill="none" stroke="#8b0000" stroke-width="0.6" opacity="0.35"/>

  <!-- Scanlines -->
  <rect x="18" y="0" width="964" height="1.2" fill="#dc143c" opacity="0.15" class="scan-h"/>
  <rect x="0" y="18" width="1.2" height="384" fill="#6a0dad" opacity="0.12" class="scan-v"/>

  <!-- Large background Geass eye rings -->
  <g class="eye-bg">
    <circle cx="500" cy="195" r="145" fill="none" stroke="#6a0dad" stroke-width="1.2" stroke-dasharray="12 18" class="geass-outer"/>
    <circle cx="500" cy="195" r="120" fill="none" stroke="#dc143c" stroke-width="0.8" stroke-dasharray="5 15" class="geass-inner"/>
    <circle cx="500" cy="195" r="95" fill="none" stroke="#4b0082" stroke-width="0.5" class="geass-outer"/>
    <!-- Geass V symbol -->
    <path d="M 500 110 L 455 195 L 500 215 L 545 195 Z" fill="none" stroke="#dc143c" stroke-width="1.5" class="geass-inner" opacity="0.4"/>
  </g>

  <!-- Corner HUD left -->
  <g class="hud" transform="translate(36,38)" font-family="Share Tech Mono,monospace" font-size="9.5" fill="#6a0dad">
    <path d="M 0 0 L 0 22 M 0 0 L 22 0" stroke="#6a0dad" stroke-width="1.8" fill="none"/>
    <text x="6"  y="36">OPERATION.ZERO</text>
    <text x="6"  y="50">GEASS // ABSOLUTE</text>
    <text x="6"  y="64">STRATEGY // LOADED</text>
    <line x1="0" y1="72" x2="128" y2="72" stroke="#6a0dad" stroke-width="0.5" opacity="0.4"/>
    <text x="6"  y="84" fill="#8b0000">EMPEROR // TARGET</text>
  </g>

  <!-- Corner HUD right -->
  <g class="hud" transform="translate(836,38)" font-family="Share Tech Mono,monospace" font-size="9.5" fill="#8b0000">
    <path d="M 128 0 L 128 22 M 128 0 L 106 0" stroke="#8b0000" stroke-width="1.8" fill="none"/>
    <text x="0"  y="36">RANK // DEMON KING</text>
    <text x="0"  y="50">PIECES.LOST // ZERO</text>
    <text x="0"  y="64">MOVES.AHEAD // ∞</text>
    <line x1="0" y1="72" x2="128" y2="72" stroke="#8b0000" stroke-width="0.5" opacity="0.4"/>
    <text x="0"  y="84" fill="#6a0dad">ENDGAME // CERTAIN</text>
  </g>

  <!-- Bottom corner brackets -->
  <g stroke="#6a0dad" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M 36 392 L 36 370 M 36 392 L 58 392"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.9s" repeatCount="indefinite"/></path>
    <path d="M 964 392 L 964 370 M 964 392 L 942 392"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.3s" repeatCount="indefinite"/></path>
  </g>

  <!-- Floating chess pieces -->
  <text x="100"  y="230" font-family="serif" font-size="52" fill="#4b0082" class="cf1" filter="url(#glowPurple)">♔</text>
  <text x="855"  y="210" font-family="serif" font-size="38" fill="#6a0dad" class="cf2" filter="url(#glowPurple)">♞</text>
  <text x="135"  y="330" font-family="serif" font-size="30" fill="#8b0000" class="cf3">♜</text>
  <text x="815"  y="320" font-family="serif" font-size="34" fill="#4b0082" class="cf1">♛</text>

  <!-- ZERO — glitch title layers -->
  <g text-anchor="middle" font-family="Share Tech Mono,monospace" font-weight="700" letter-spacing="22">
    <text x="505" y="186" font-size="90" fill="#dc143c" opacity="0">
      ZERO
      <animate attributeName="x" values="505;496;507;500" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0;0.35;0" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="495" y="186" font-size="90" fill="#6a0dad" opacity="0">
      ZERO
      <animate attributeName="x" values="495;505;492;500" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.55;0;0.3" dur="4.1s" repeatCount="indefinite"/>
    </text>
    <!-- Main -->
    <text x="500" y="186" font-size="90" fill="#f0eaf8" class="title-main" filter="url(#glowCrimson)">ZERO</text>
  </g>

  <!-- Subtitle -->
  <text x="500" y="227" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="12.5" fill="#9b59b6" letter-spacing="7" class="subtitle">
    THE DEMON EMPEROR — IMMORTALIZED IN LOGIC
  </text>

  <!-- Decorative rule -->
  <line x1="220" y1="241" x2="780" y2="241" stroke="url(#bgGrad)" stroke-width="0">
    <animate attributeName="stroke" values="#4b0082;#dc143c;#4b0082" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="220" y1="241" x2="780" y2="241" stroke="#6a0dad" stroke-width="0.6" opacity="0.5"/>

  <!-- Tactical notation -->
  <text x="500" y="263" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10" fill="#4b0082" letter-spacing="3" opacity="0.65">
    [ a1 → e4 → checkmate  ·  all according to plan ]
  </text>

  <!-- Rose petals -->
  <ellipse cx="70"  cy="420" rx="5" ry="9" fill="#8b0000" class="rose1" transform="rotate(-25,70,420)"/>
  <ellipse cx="930" cy="420" rx="4" ry="7" fill="#6a0dad" class="rose2" transform="rotate(15,930,420)"/>
  <ellipse cx="200" cy="420" rx="6" ry="10" fill="#8b0000" class="rose3" transform="rotate(10,200,420)"/>
  <ellipse cx="800" cy="420" rx="4" ry="8" fill="#4b0082" class="rose4" transform="rotate(-20,800,420)"/>

  <!-- Bottom signature -->
  <text x="500" y="394" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10.5" fill="#6a0dad" letter-spacing="5" class="sig">
    watashiwa01  //  OPERATION ZERO  //  ONLINE
  </text>
</svg>
