<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="lawsBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020006"/>
      <stop offset="50%" stop-color="#0d0022"/>
      <stop offset="100%" stop-color="#020006"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a001a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#14002e" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="lawGlowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lawGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lawGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes borderPulse1 { 0%, 100% { stroke: #ff3fa4; opacity: 0.6; } 50% { stroke: #ff0077; opacity: 1; } }
    @keyframes borderPulse2 { 0%, 100% { stroke: #7d7dff; opacity: 0.6; } 50% { stroke: #a3a3ff; opacity: 1; } }
    @keyframes borderPulse3 { 0%, 100% { stroke: #00ff9c; opacity: 0.6; } 50% { stroke: #00ffc2; opacity: 1; } }
    
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.4; }
      50% { transform: translateY(-6px) scale(1.1); opacity: 0.9; }
    }
    @keyframes pulseBackground {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }
    @keyframes cardHoverEffect {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .law-card-1 { animation: cardHoverEffect 6s infinite ease-in-out; }
    .law-card-2 { animation: cardHoverEffect 6s infinite ease-in-out; animation-delay: 2s; }
    .law-card-3 { animation: cardHoverEffect 6s infinite ease-in-out; animation-delay: 4s; }

    .border-1 { animation: borderPulse1 3s infinite ease-in-out; }
    .border-2 { animation: borderPulse2 3s infinite ease-in-out; }
    .border-3 { animation: borderPulse3 3s infinite ease-in-out; }

    .sigil-1 { animation: floatParticle 3s infinite ease-in-out; transform-origin: 150px 80px; }
    .sigil-2 { animation: floatParticle 3.5s infinite ease-in-out; transform-origin: 450px 80px; }
    .sigil-3 { animation: floatParticle 4s infinite ease-in-out; transform-origin: 750px 80px; }

    .bg-pulse { animation: pulseBackground 8s infinite ease-in-out; }
  </style>

  <!-- Background Rect -->
  <rect width="900" height="220" rx="16" fill="url(#lawsBg)"/>
  
  <!-- Outer Glow border for the whole section -->
  <rect x="1.5" y="1.5" width="897" height="217" rx="15.5" fill="none" stroke="#7d7dff" stroke-width="1.5" opacity="0.3" class="bg-pulse"/>

  <!-- Title -->
  <g transform="translate(450, 32)">
    <text text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#ff3fa4" letter-spacing="8" font-weight="bold">
      THE THREE LAWS OF THIS MYTH
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </text>
    <line x1="-420" y1="12" x2="420" y2="12" stroke="#ff3fa4" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- LAW 1 CARD -->
  <g transform="translate(30, 60)" class="law-card-1">
    <!-- Card Base -->
    <rect width="240" height="135" rx="12" fill="url(#cardBg1)" stroke="#ff3fa4" stroke-width="1.5" class="border-1" filter="url(#lawGlowPink)"/>
    <!-- Card Grid Accent -->
    <line x1="20" y1="15" x2="220" y2="15" stroke="#ff3fa4" stroke-width="0.5" opacity="0.25"/>
    <line x1="20" y1="120" x2="220" y2="120" stroke="#ff3fa4" stroke-width="0.5" opacity="0.25"/>
    
    <!-- Law Number -->
    <text x="120" y="38" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#777" letter-spacing="3">LAW I</text>
    
    <!-- Text Content -->
    <text x="120" y="66" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#ff3fa4" font-weight="bold">Absolute Inconsistency</text>
    <text x="120" y="88" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#cfcfcf">Nothing remains stable</text>
    <text x="120" y="104" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#cfcfcf">across readings</text>
    
    <!-- Little pulsing dot indicator -->
    <circle cx="120" cy="120" r="3" fill="#ff3fa4" class="sigil-1"/>
  </g>

  <!-- LAW 2 CARD -->
  <g transform="translate(330, 60)" class="law-card-2">
    <!-- Card Base -->
    <rect width="240" height="135" rx="12" fill="url(#cardBg1)" stroke="#7d7dff" stroke-width="1.5" class="border-2" filter="url(#lawGlowPurple)"/>
    <!-- Card Grid Accent -->
    <line x1="20" y1="15" x2="220" y2="15" stroke="#7d7dff" stroke-width="0.5" opacity="0.25"/>
    <line x1="20" y1="120" x2="220" y2="120" stroke="#7d7dff" stroke-width="0.5" opacity="0.25"/>
    
    <!-- Law Number -->
    <text x="120" y="38" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#777" letter-spacing="3">LAW II</text>
    
    <!-- Text Content -->
    <text x="120" y="66" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#7d7dff" font-weight="bold">Duality Canon</text>
    <text x="120" y="88" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#cfcfcf">All contradictions are</text>
    <text x="120" y="104" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#cfcfcf">acknowledged as true</text>
    
    <!-- Little pulsing dot indicator -->
    <circle cx="120" cy="120" r="3" fill="#7d7dff" class="sigil-2"/>
  </g>

  <!-- LAW 3 CARD -->
  <g transform="translate(630, 60)" class="law-card-3">
    <!-- Card Base -->
    <rect width="240" height="135" rx="12" fill="url(#cardBg1)" stroke="#00ff9c" stroke-width="1.5" class="border-3" filter="url(#lawGlowCyan)"/>
    <!-- Card Grid Accent -->
    <line x1="20" y1="15" x2="220" y2="15" stroke="#00ff9c" stroke-width="0.5" opacity="0.25"/>
    <line x1="20" y1="120" x2="220" y2="120" stroke="#00ff9c" stroke-width="0.5" opacity="0.25"/>
    
    <!-- Law Number -->
    <text x="120" y="38" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#777" letter-spacing="3">LAW III</text>
    
    <!-- Text Content -->
    <text x="120" y="66" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="13" fill="#00ff9c" font-weight="bold">Observer Inclusion</text>
    <text x="120" y="88" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#cfcfcf">The watcher has always</text>
    <text x="120" y="104" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10.5" fill="#cfcfcf">been part of the drift</text>
    
    <!-- Little pulsing dot indicator -->
    <circle cx="120" cy="120" r="3" fill="#00ff9c" class="sigil-3"/>
  </g>
</svg>
