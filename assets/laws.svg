<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lawsBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="50%" stop-color="#0d001f"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <filter id="gLaw">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes lawFloat1 { 0%,100%{transform:translateY(0)} 33%{transform:translateY(-5px)} }
    @keyframes lawFloat2 { 0%,100%{transform:translateY(0)} 66%{transform:translateY(-5px)} }
    @keyframes lawFloat3 { 0%,100%{transform:translateY(0)} 100%{transform:translateY(-5px)} }
    @keyframes shimmer { 0%,100%{opacity:0.6} 50%{opacity:1} }
  </style>

  <rect width="900" height="160" rx="16" fill="url(#lawsBg)"/>
  <rect x="1" y="1" width="898" height="158" rx="15" fill="none" stroke="#ff3fa4" stroke-width="1" opacity="0.4">
    <animate attributeName="stroke" values="#ff3fa4;#7d7dff;#00ff9c;#ff3fa4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="13" fill="#ff3fa4" letter-spacing="8" class="shimmer">
    THE THREE LAWS OF THIS MYTH
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Law 1 -->
  <g>
    <text x="150" y="80" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10" fill="#5f5f5f" letter-spacing="1">LAW I</text>
    <text x="150" y="100" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#ff3fa4">Nothing is consistent</text>
    <text x="150" y="116" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#ff3fa4">across readings</text>
    <circle cx="150" cy="138" r="4" fill="#ff3fa4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Divider 1 -->
  <line x1="290" y1="60" x2="290" y2="145" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- Law 2 -->
  <g>
    <text x="450" y="80" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10" fill="#5f5f5f" letter-spacing="1">LAW II</text>
    <text x="450" y="100" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#7d7dff">All contradictions</text>
    <text x="450" y="116" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#7d7dff">are canon</text>
    <circle cx="450" cy="138" r="4" fill="#7d7dff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Divider 2 -->
  <line x1="610" y1="60" x2="610" y2="145" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- Law 3 -->
  <g>
    <text x="750" y="80" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="10" fill="#5f5f5f" letter-spacing="1">LAW III</text>
    <text x="750" y="100" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#00ff9c">The observer is always</text>
    <text x="750" y="116" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="11" fill="#00ff9c">already included</text>
    <circle cx="750" cy="138" r="4" fill="#00ff9c">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
