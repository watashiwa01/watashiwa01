<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arsenalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#0a0018"/>
    </linearGradient>
    <filter id="gArsenal">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes scanH { 0%{transform:translateX(-900px)} 100%{transform:translateX(900px)} }
    @keyframes rowGlow { 0%,100%{opacity:0.5} 50%{opacity:1} }
    @keyframes barGrowA { 0%,100%{width:0} 25%,75%{width:280px} }
    @keyframes barGrowB { 0%,100%{width:0} 25%,75%{width:245px} }
    @keyframes barGrowC { 0%,100%{width:0} 25%,75%{width:280px} }
    @keyframes barGrowD { 0%,100%{width:0} 25%,75%{width:245px} }
    @keyframes barGrowE { 0%,100%{width:0} 25%,75%{width:210px} }
    .scan-h { animation: scanH 5s infinite linear; }
  </style>

  <rect width="900" height="260" rx="16" fill="url(#arsenalBg)"/>
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="#00ff9c" stroke-width="1" opacity="0.3">
    <animate attributeName="stroke" values="#00ff9c;#ff3fa4;#7d7dff;#00ff9c" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Horizontal scan sweep -->
  <rect x="0" y="0" width="900" height="2" fill="#00ff9c" opacity="0.2" class="scan-h"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="13" fill="#00ff9c" letter-spacing="8">
    THE ARSENAL — WEAPON SCHEMA
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Separator line -->
  <line x1="30" y1="48" x2="870" y2="48" stroke="#00ff9c" stroke-width="0.5" opacity="0.3"/>

  <!-- Header row -->
  <text x="50" y="68" font-family="Share Tech Mono,monospace" font-size="10" fill="#5f5f5f" letter-spacing="2">ARTIFACT</text>
  <text x="280" y="68" font-family="Share Tech Mono,monospace" font-size="10" fill="#5f5f5f" letter-spacing="2">DOMAIN</text>
  <text x="480" y="68" font-family="Share Tech Mono,monospace" font-size="10" fill="#5f5f5f" letter-spacing="2">ALIGNMENT LEVEL</text>

  <!-- Row 1: Python -->
  <g>
    <rect x="30" y="75" width="840" height="30" rx="4" fill="#00ff9c" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="96" font-family="Share Tech Mono,monospace" font-size="12" fill="#00ff9c">Python</text>
    <text x="280" y="96" font-family="Share Tech Mono,monospace" font-size="12" fill="#8affc1">AI / ML</text>
    <rect x="480" y="85" width="290" height="8" rx="4" fill="#0d0d0d"/>
    <rect x="480" y="85" height="8" rx="4" fill="#00ff9c">
      <animate attributeName="width" values="0;280;280;0" keyTimes="0;0.2;0.8;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="785" y="96" font-family="Share Tech Mono,monospace" font-size="10" fill="#00ff9c">100%</text>
  </g>

  <!-- Row 2: PyTorch -->
  <g>
    <rect x="30" y="110" width="840" height="30" rx="4" fill="#ff3fa4" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="131" font-family="Share Tech Mono,monospace" font-size="12" fill="#ff3fa4">PyTorch</text>
    <text x="280" y="131" font-family="Share Tech Mono,monospace" font-size="12" fill="#ff9acb">Deep Learning</text>
    <rect x="480" y="120" width="290" height="8" rx="4" fill="#0d0d0d"/>
    <rect x="480" y="120" height="8" rx="4" fill="#ff3fa4">
      <animate attributeName="width" values="0;245;245;0" keyTimes="0;0.2;0.8;1" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="785" y="131" font-family="Share Tech Mono,monospace" font-size="10" fill="#ff3fa4">84%</text>
  </g>

  <!-- Row 3: LLM APIs -->
  <g>
    <rect x="30" y="145" width="840" height="30" rx="4" fill="#00ff9c" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="166" font-family="Share Tech Mono,monospace" font-size="12" fill="#00ff9c">LLM APIs</text>
    <text x="280" y="166" font-family="Share Tech Mono,monospace" font-size="12" fill="#8affc1">AI Systems</text>
    <rect x="480" y="155" width="290" height="8" rx="4" fill="#0d0d0d"/>
    <rect x="480" y="155" height="8" rx="4" fill="#00ff9c">
      <animate attributeName="width" values="0;280;280;0" keyTimes="0;0.2;0.8;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="785" y="166" font-family="Share Tech Mono,monospace" font-size="10" fill="#00ff9c">100%</text>
  </g>

  <!-- Row 4: Linux -->
  <g>
    <rect x="30" y="180" width="840" height="30" rx="4" fill="#7d7dff" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="201" font-family="Share Tech Mono,monospace" font-size="12" fill="#7d7dff">Linux</text>
    <text x="280" y="201" font-family="Share Tech Mono,monospace" font-size="12" fill="#b5b5ff">Systems</text>
    <rect x="480" y="190" width="290" height="8" rx="4" fill="#0d0d0d"/>
    <rect x="480" y="190" height="8" rx="4" fill="#7d7dff">
      <animate attributeName="width" values="0;245;245;0" keyTimes="0;0.2;0.8;1" dur="6s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="785" y="201" font-family="Share Tech Mono,monospace" font-size="10" fill="#7d7dff">84%</text>
  </g>

  <!-- Row 5: Solidity -->
  <g>
    <rect x="30" y="215" width="840" height="30" rx="4" fill="#ffd166" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="236" font-family="Share Tech Mono,monospace" font-size="12" fill="#ffd166">Solidity</text>
    <text x="280" y="236" font-family="Share Tech Mono,monospace" font-size="12" fill="#ffe9a0">Blockchain</text>
    <rect x="480" y="225" width="290" height="8" rx="4" fill="#0d0d0d"/>
    <rect x="480" y="225" height="8" rx="4" fill="#ffd166">
      <animate attributeName="width" values="0;210;210;0" keyTimes="0;0.2;0.8;1" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="785" y="236" font-family="Share Tech Mono,monospace" font-size="10" fill="#ffd166">72%</text>
  </g>
</svg>
