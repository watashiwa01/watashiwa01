<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="runeDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="20%" stop-color="#00ff9c"/>
      <stop offset="50%" stop-color="#ff3fa4"/>
      <stop offset="80%" stop-color="#7d7dff"/>
      <stop offset="100%" stop-color="#000000"/>
      <animate attributeName="x1" values="0%;-100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="2" y="2" fill="url(#runeDiv)" rx="1"/>
  <circle cx="450" cy="3" r="3" fill="#00ff9c">
    <animate attributeName="fill" values="#00ff9c;#ff3fa4;#7d7dff;#00ff9c" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
