<svg width="900" height="48" viewBox="0 0 900 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hdrLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
