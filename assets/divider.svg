<svg width="100%" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Plasma wave color shifting gradient -->
    <linearGradient id="runeDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00ff9c" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ff3fa4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffe259" stop-opacity="1"/>
      <stop offset="65%" stop-color="#7d7dff" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#00c2ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;-100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subtle glow filter for the central sigil -->
    <filter id="sigilGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes slideRunesRight {
      0% { transform: translateX(-150px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateX(400px); opacity: 0; }
    }
    @keyframes slideRunesLeft {
      0% { transform: translateX(150px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateX(-400px); opacity: 0; }
    }
    @keyframes spinSigil {
      0% { transform: translate(450px, 12px) rotate(0deg); }
      100% { transform: translate(450px, 12px) rotate(360deg); }
    }
    @keyframes pulseSigil {
      0%, 100% { r: 5; fill: #00ff9c; filter: drop-shadow(0 0 2px #00ff9c); }
      33% { r: 7; fill: #ff3fa4; filter: drop-shadow(0 0 6px #ff3fa4); }
      66% { r: 6; fill: #7d7dff; filter: drop-shadow(0 0 5px #7d7dff); }
    }
    
    .rune-group-right {
      animation: slideRunesRight 12s infinite linear;
    }
    .rune-group-left {
      animation: slideRunesLeft 14s infinite linear;
    }
    .central-sigil {
      transform-origin: 0px 0px;
      animation: spinSigil 8s infinite linear;
    }
    .sigil-core {
      animation: pulseSigil 4s infinite ease-in-out;
    }
  </style>

  <!-- Top bar (Thin) -->
  <line x1="30" y1="8" x2="870" y2="8" stroke="#333" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Main Plasma Wave Bar -->
  <rect width="900" height="3" y="10.5" fill="url(#runeDiv)" rx="1.5"/>

  <!-- Bottom bar (Thin) -->
  <line x1="30" y1="16" x2="870" y2="16" stroke="#333" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Sliding Runes on the left side of central sigil (moving right) -->
  <g class="rune-group-right" font-family="Share Tech Mono, monospace" font-size="8" fill="#ffe259" opacity="0">
    <text x="50" y="14">ᚠ  ᚢ  ᚦ  ᚨ  ᚱ</text>
  </g>

  <!-- Sliding Runes on the right side of central sigil (moving left) -->
  <g class="rune-group-left" font-family="Share Tech Mono, monospace" font-size="8" fill="#00ff9c" opacity="0">
    <text x="650" y="14">ᛏ  ᛒ  ᛖ  ᛗ  ᛚ</text>
  </g>

  <!-- Central Duality Sigil (Morphs and spins) -->
  <g class="central-sigil" filter="url(#sigilGlow)">
    <!-- Rotating outer ring -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#eafff0" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.8"/>
    
    <!-- Rotating decorative elements -->
    <path d="M -12 0 L -8 0 M 8 0 L 12 0 M 0 -12 L 0 -8 M 0 8 L 0 12" stroke="#ffa751" stroke-width="0.75"/>
    
    <!-- Inner morphing/pulsing core -->
    <circle cx="0" cy="0" r="5" class="sigil-core"/>
    
    <!-- Tiny central symbol (Mr Fool's Duality) -->
    <text x="-3" y="3" font-family="Share Tech Mono, monospace" font-size="9" fill="#030008" font-weight="bold">🜏</text>
  </g>

  <!-- Micro-dot arrays flanking the center -->
  <g opacity="0.5">
    <circle cx="420" cy="12" r="1.5" fill="#ff3fa4"/>
    <circle cx="400" cy="12" r="1" fill="#7d7dff"/>
    <circle cx="380" cy="12" r="1" fill="#333"/>
    
    <circle cx="480" cy="12" r="1.5" fill="#00ff9c"/>
    <circle cx="500" cy="12" r="1" fill="#00c2ff"/>
    <circle cx="520" cy="12" r="1" fill="#333"/>
  </g>
</svg>
